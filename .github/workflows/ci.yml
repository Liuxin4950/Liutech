name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/**]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'LiuTech/**'
            ai:
              - 'LiuTech-AI/**'
            web:
              - 'Web/**'
            admin:
              - 'Admin/**'
            common:
              - 'pom.xml'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'Docs/SQL/**'
              - 'mysql/**'
              - 'nginx/**'
              - 'scripts/check-mirrored-modules.mjs'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -f LiuTech/pom.xml test

  ai-test:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -f LiuTech-AI/pom.xml test

  frontend-contract:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-mirrored-modules.mjs

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Admin/package-lock.json
      - run: npm ci
      - run: npm run build
