# GitHub Actions CI/CD 配置
# 功能：构建 Docker 镜像并推送到 Docker Hub
# 触发：推送到 main 分支，或手动触发

name: Liutech Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

# 避免并发部署
concurrency:
  group: liutech-production
  cancel-in-progress: true

# 环境变量（所有 job 共享）
env:
  DOCKER_HUB: liuxin4950  # Docker Hub 用户名

jobs:
  # ==================== Job 1: 构建后端 ====================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend JAR
        run: mvn -f LiuTech/pom.xml clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./LiuTech
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}/liutech-backend:latest
            ${{ env.DOCKER_HUB }}/liutech-backend:${{ github.sha }}
          platforms: linux/amd64

  # ==================== Job 2: 构建 AI 服务 ====================
  build-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build AI service JAR
        run: mvn -f LiuTech-AI/pom.xml clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push AI image
        uses: docker/build-push-action@v5
        with:
          context: ./LiuTech-AI
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}/liutech-ai:latest
            ${{ env.DOCKER_HUB }}/liutech-ai:${{ github.sha }}
          platforms: linux/amd64

  # ==================== Job 3: 构建 Web 前端 ====================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Web/package-lock.json

      - name: Install dependencies
        working-directory: ./Web
        run: npm ci

      - name: Build Web frontend
        working-directory: ./Web
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./Web
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}/liutech-web:latest
            ${{ env.DOCKER_HUB }}/liutech-web:${{ github.sha }}
          platforms: linux/amd64

  # ==================== Job 4: 构建 Admin 前端 ====================
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Admin/package-lock.json

      - name: Install dependencies
        working-directory: ./Admin
        run: npm ci

      - name: Build Admin frontend
        working-directory: ./Admin
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v5
        with:
          context: ./Admin
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}/liutech-admin:latest
            ${{ env.DOCKER_HUB }}/liutech-admin:${{ github.sha }}
          platforms: linux/amd64

  # ==================== Job 5: 构建 Nginx ====================
  build-nginx:
    runs-on: ubuntu-latest
    needs: [build-web, build-admin]  # 等待前端构建完成
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}/liutech-nginx:latest
            ${{ env.DOCKER_HUB }}/liutech-nginx:${{ github.sha }}
          platforms: linux/amd64

  # ==================== Job 6: 自动部署到服务器 ====================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-ai, build-web, build-admin, build-nginx]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,sql/sql.sql"
          target: "/opt/liutech/"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/liutech

            # 拉取最新镜像（带重试）
            PULL_SUCCESS=false
            for i in 1 2 3; do
              if docker compose pull; then
                PULL_SUCCESS=true
                break
              fi
              echo "Pull failed, retrying in 10s... ($i/3)"
              sleep 10
            done

            # pull 失败则退出，不执行 down（避免用旧镜像重建）
            if [ "$PULL_SUCCESS" = false ]; then
              echo "❌ Pull failed after 3 attempts, skipping deploy"
              exit 1
            fi

            # pull 成功后才重建
            docker compose down
            docker compose up -d --remove-orphans

            # 清理旧镜像
            docker image prune -f

            # 健康检查
            sleep 10
            if curl -s -o /dev/null -w "%{http_code}" http://localhost | grep -qE "^(200|301|302)$"; then
              echo "✅ 部署成功，网站可访问"
            else
              echo "⚠️ 部署完成，但网站可能未正常响应"
            fi

            echo "部署完成: $(date)"

            echo "部署完成: $(date)"
