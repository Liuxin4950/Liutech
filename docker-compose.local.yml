# 独立的本机验收环境。使用 .env.admin-review.local；不加载生产 Compose，不连接远程存储/邮件/模型。
name: liutech-local
services:
  mysql:
    image: mysql:8.0
    container_name: liutech-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD is required}
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:33079:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Docs/SQL/sql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    image: liutech-backend:local-review
    build: ./LiuTech
    container_name: liutech-local-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_APP_PASSWORD: ${LOCAL_APP_PASSWORD:?LOCAL_APP_PASSWORD is required}
      JWT_SECRET: ${LOCAL_JWT_SECRET:?LOCAL_JWT_SECRET is required}
      LIUTECH_INTERNAL_TOKEN: ${LOCAL_INTERNAL_TOKEN:?LOCAL_INTERNAL_TOKEN is required}
      AI_USER_DATA_URL: http://ai:8081
      FILE_UPLOAD_BASE_PATH: /app/uploads
      COS_ENABLED: "false"
      COS_MIGRATE: "false"
      SERVER_BASE_URL: http://localhost:3000
      MAIL_HOST: localhost
      MAIL_PORT: 1
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  ai:
    image: liutech-ai:local-review
    build: ./LiuTech-AI
    container_name: liutech-local-ai
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_AI_APP_PASSWORD: ${LOCAL_AI_APP_PASSWORD:?LOCAL_AI_APP_PASSWORD is required}
      BLOG_API_URL: http://backend:8080
      LIUTECH_INTERNAL_TOKEN: ${LOCAL_INTERNAL_TOKEN:?LOCAL_INTERNAL_TOKEN is required}
      SPRING_AI_OPENAI_API_KEY: local-test-no-provider-key
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      mysql: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  web:
    image: liutech-web:local-review
    build:
      context: ./Web
      dockerfile_inline: |
        FROM nginx:alpine
        COPY dist /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/nginx.conf
    container_name: liutech-local-web
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend, ai]
  admin:
    image: liutech-admin:local-review
    build:
      context: ./Admin
      dockerfile_inline: |
        FROM nginx:alpine
        COPY dist /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/nginx.conf
    container_name: liutech-local-admin
    restart: unless-stopped
    ports: ["127.0.0.1:3001:80"]
    depends_on: [backend, ai]
  nginx:
    image: liutech-nginx:local-review
    build:
      context: ./nginx
      dockerfile_inline: |
        FROM nginx:alpine
        COPY nginx.local.conf /etc/nginx/conf.d/default.conf
        COPY local-proxy.include /etc/nginx/local-proxy.include
    container_name: liutech-local-nginx
    restart: unless-stopped
    ports: ["127.0.0.1:80:80", "127.0.0.1:81:81"]
    depends_on: [backend, ai, web, admin]
volumes:
  mysql_data:
  uploads:
