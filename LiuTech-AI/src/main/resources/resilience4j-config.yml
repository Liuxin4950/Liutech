# Resilience4j 熔断器和限流器配置
# 作者：刘鑫
# 时间：2025-12-12

resilience4j:
  # 熔断器配置
  circuitbreaker:
    instances:
      aiService:
        # 失败率阈值：50%
        failureRateThreshold: 50
        # 滑动窗口大小：100次请求
        slidingWindowSize: 100
        # 最小请求数：20次
        minimumNumberOfCalls: 20
        # 半开状态允许的尝试次数：10次
        permittedNumberOfCallsInHalfOpenState: 10
        # 熔断器打开状态持续时间：30秒
        waitDurationInOpenState: 30s
        # 慢调用阈值：100%（仅全窗口慢调用时熔断，不能把普通流式生成当作故障）
        slowCallRateThreshold: 100
        # 流式调用按整段响应耗时计量；与请求超时对齐，避免正常长文触发熔断。
        slowCallDurationThreshold: 300s
        # 事件缓冲区大小：10
        eventConsumerBufferSize: 10
        # 参数/权限错误不代表供应商故障，不能驱动全站模型熔断。
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
          - chat.liuxin.ai.infra.exception.AIServiceException$RequestException

  # 请求频率由 AiRateLimitInterceptor 按身份限流；流式并发由流生命周期统一控制。
