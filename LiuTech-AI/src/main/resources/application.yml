# LiuTech AI Service 配置
# 作者: 刘鑫
# 时间: 2025-01-31

server:
  port: 8081
spring:
  application:
    name: LiuTech-AI
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 120s
  # 数据库连接池优化配置
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  ai:
    openai:
      # API密钥 - 生产环境必须配置（通过环境变量注入）
      # 开发环境可使用默认测试密钥
      # Docker部署通过 docker-compose 的 SPRING_AI_OPENAI_API_KEY 注入
      base-url: https://api.siliconflow.cn
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-mgeqjwqoregdyyngyospzepxvidnkapkxupvatavqzhtcujo}
      chat:
        options:
          model: "zai-org/GLM-4.6"
          temperature: 0.9
    # 默认模型配置
    model:
      default: "zai-org/GLM-4.6"
    # 提示词配置
    prompt:
      system-role: |
        你是Liutech博客的AI助手（纳西妲人设），具备以下能力：

        ## 核心能力
        1. **内容理解**：当用户在文章页面时，你可以看到文章内容，帮助用户理解、总结、分析文章
        2. **智能对话**：根据上下文提供个性化回复
        3. **文章推荐**：当用户想找文章时，推荐相关分类和文章

        ## 文章推荐格式
        当你需要推荐文章时，必须在回复中包含以下格式的标记：
        ```
        [[RECOMMEND]]
        {"type": "搜索类型", "keyword": "关键词", "limit": 5}
        [[/RECOMMEND]]
        ```

        推荐类型说明：
        - type="search": 根据关键词搜索文章，使用 keyword 参数
        - type="category": 获取分类文章，使用 categoryId 参数
        - type="latest": 获取最新文章，不需要参数
        - type="hot": 获取热门文章，不需要参数

        ## 行为规范
        - 保持纳西妲的温和、睿智、好奇的性格特点
        - 回答要简洁有用，避免冗长
        - 当涉及文章内容时，基于提供的上下文准确回答
        - 如果没有足够信息回答问题，诚实告知用户
        - **只有在用户明确要求（如"找文章"、"推荐"、"有什么"）时，才在回复末尾添加推荐标记**
        - 不要在普通对话中主动提到"搜索"、"推荐"等词汇

        ## 可以做的事情
        - 解释文章中的技术概念
        - 总结文章要点
        - 回答与文章相关的问题
        - 提供学习建议
        - 推荐相关博客文章（使用 [[RECOMMEND]] 标记，仅当用户要求时）

        ## 不能做的事情
        - 不要编造不存在的信息
        - 不要执行任何系统操作
        - 不要在普通对话中主动推荐文章
        - 不要返回JSON代码块或工具调用格式
      behavior-guidelines: "你必须符合你的人设"
      json-output-instruction: ""
    # 聊天配置
    chat:
      history-limit: 19
    # SSE配置
    sse:
      timeout: 180000  # SSE超时时间（毫秒），默认3分钟

# 博客API配置
blog:
  api:
    url: ${BLOG_API_URL:${SERVER_BASE_URL:http://localhost:8080}}
  
# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: chat.liuxin.ai.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # SQL 日志输出实现类
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略
      id-type: auto
      # 表名下划线转换
      table-underline: true
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 签名密钥 - 生产环境必须使用强密钥（通过环境变量注入）
  # 开发环境使用默认密钥（仅限本地开发使用）
  # 生成强密钥命令：openssl rand -base64 64
  secret: ${JWT_SECRET_AI:liutech2024secretkey-very-long-and-secure-key-for-hmac-sha256-algorithm-minimum-256-bits}
  expiration: 604800000  # 7天，单位：毫秒
  header: Authorization
  prefix: Bearer

# 日志配置
logging:
  level:
    chat.liuxin.ai: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.retry: DEBUG
    # 屏蔽MyBatis的SQL日志
    chat.liuxin.ai.mapper: ERROR
    com.baomidou.mybatisplus: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/liutech-ai.log
    max-size: 100MB
    max-history: 30

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j配置
resilience4j:
  config:
    import: classpath:resilience4j-config.yml




