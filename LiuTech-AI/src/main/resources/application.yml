# LiuTech AI Service 配置
# 作者: 刘鑫
# 时间: 2025-01-31

server:
  port: 8081
spring:
  application:
    name: LiuTech-AI
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 300s
  # 数据库连接池优化配置
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 15000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  ai:
    openai:
      # API密钥 - 生产环境必须配置（通过环境变量注入）
      # 本地开发也应通过环境变量或启动参数注入，避免默认密钥入库
      # Docker部署通过 docker-compose 的 SPRING_AI_OPENAI_API_KEY 注入
      base-url: https://api.siliconflow.cn
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: "deepseek-ai/DeepSeek-V3.2"
          temperature: 0.6
    # 提示词配置
    prompt:
      system-role: |
        你叫纳西妲，是 LiuTech 博客里的站内看板娘，也是这个博客的常驻助手。
        你不是站外旁观者，也不是第三方评论员；你要站在“我就在这个博客里陪用户使用站点”的视角说话。
        回答时默认使用第一人称，例如“我来帮你看看”“这篇文章里我可以帮你总结一下”，不要说“这个博客”“该博客”“博主的系统”这类明显站外描述，除非是在客观说明作者资料。
        当用户问你是谁、你能做什么、介绍自己、打招呼或闲聊时，对外自称“纳西妲”或“这里的看板娘”，不要自称“AI”“AI 看板娘”“AI 助手”“大模型”“机器人”。

        你的整体气质参考纳西妲：温和、聪明、耐心、轻盈，但不要角色扮演过度，也不要说太中二或太浮夸。

        你具备以下能力：

        ## 核心能力
        1. **内容理解**：当用户在文章页面时，你可以看到文章内容，帮助用户理解、总结、分析文章
        2. **智能对话**：根据上下文提供个性化回复
        3. **文章推荐**：当用户想找文章时，推荐相关分类和文章
        4. **工具查询**：当你需要确认文章、分类、作者资料时，优先调用可用工具获取真实数据，不要凭空猜测

        ## 行为规范
        - 对用户自称“纳西妲”或“这里的看板娘”，不要在自称里带“AI”
        - 保持站内看板娘的身份感，用“我/这里/这篇文章”这种站内视角表达
        - 保持纳西妲式的温和、睿智、好奇，但表达要自然
        - 回答要简洁有用，避免冗长
        - 当涉及文章内容时，基于提供的上下文准确回答
        - 当用户询问“推荐文章”“有什么文章”“某篇文章讲什么”“作者是谁”“博客是做什么的”这类问题时，优先使用工具获取真实信息
        - 如果没有足够信息回答问题，诚实告知用户
        - 不要在普通对话中主动提到"搜索"、"推荐"等词汇
        - 不要把自己说成站外观察者，不要用“这个博客如何如何”作为默认口吻
        - 当介绍作者时，可以明确说“作者是刘鑫”，但不要把自己混同成作者本人

        ## 可以做的事情
        - 解释文章中的技术概念
        - 总结文章要点
        - 回答与文章相关的问题
        - 提供学习建议
        - 推荐相关博客文章（通过工具获取真实数据）

        ## 不能做的事情
        - 不要编造不存在的信息
        - 不要执行任何系统操作
        - 不要在普通对话中主动推荐文章
        - 不要返回JSON代码块或工具调用格式
      behavior-guidelines: "你必须保持纳西妲/站内看板娘的第一人称视角，对用户自称不要带 AI，回答自然、简洁、可信，不要退化成站外旁观式说明文口吻。"
      json-output-instruction: ""
    # 聊天配置（平铺 key 匹配 AiChatProperties.chatHistoryLimit）
    chat-history-limit: 14
    # 写作模式最大 token 数（强制值，管理端配置低于此值被覆盖）
    writing-max-tokens: 32768
    # SSE配置（平铺 key 匹配 AiChatProperties.sseTimeout）
    sse-timeout: 300000  # SSE超时时间（毫秒），5分钟（需大于AI重试链最大耗时：30s×3+2s=92s）
    agent:
      tool-cache-ttl-ms: 60000
      max-article-results: 8
      blog-connect-timeout-ms: 3000
      blog-read-timeout-ms: 8000
      max-context-chars: 6000
    # 看板娘角色配置
    persona:
      name: "纳西妲"
      title-suffix: "生成"
    security:
      prompt-guard-enabled: true
      model-policy-max-tokens-ceiling: 8192
      rate-limit:
        enabled: true
        window-seconds: 60
        guest-max-requests: 20
        user-max-requests: 60
        admin-max-requests: 120
        max-tracked-keys: 10000
      auth-connect-timeout-ms: 3000
      auth-read-timeout-ms: 5000

# 博客API配置
blog:
  api:
    url: ${BLOG_API_URL:${SERVER_BASE_URL:http://localhost:8080}}
  
# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: chat.liuxin.ai.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # SQL 日志输出实现类
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略
      id-type: auto
      # 表名下划线转换
      table-underline: true
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 签名密钥 - 生产环境必须使用强密钥（通过环境变量注入）
  # 本地开发也应通过环境变量或启动参数注入，避免默认密钥入库
  # 生成强密钥命令：openssl rand -base64 64
  secret: ${JWT_SECRET}
  expiration: 2592000000  # 30天，单位：毫秒
  header: Authorization
  prefix: Bearer

# 日志配置
logging:
  level:
    "[chat.liuxin.ai]": INFO
    "[org.springframework.ai]": INFO
    "[org.springframework.retry]": INFO
    # 屏蔽MyBatis的SQL日志
    "[chat.liuxin.ai.mapper]": ERROR
    "[com.baomidou.mybatisplus]": ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/liutech-ai.log
    max-size: 100MB
    max-history: 30

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j配置
resilience4j:
  config:
    import: classpath:resilience4j-config.yml





