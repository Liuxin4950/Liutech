# 默认站点配置
# 作者: 刘鑫
# 时间: 2025-01-01

# 上游服务器配置
upstream backend_servers {
    server backend:8080;
}

upstream ai_servers {
    server ai:8081;
}

upstream web_servers {
    server web:80;
}

upstream admin_servers {
    server admin:80;
}

# HTTP重定向到HTTPS（主站点）
server {
    listen 80;
    server_name liuxin.chat;
    return 301 https://$server_name$request_uri;
}

# HTTP重定向到HTTPS（admin 后台子域名）
server {
    listen 80;
    server_name admin.liuxin.chat;
    return 301 https://$server_name$request_uri;
}

# HTTPS主站点 - Web前端
server {
    listen 443 ssl;
    http2 on;
    server_name liuxin.chat;

    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/liuxin.chat_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/liuxin.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全响应头（HTML 等无自身 add_header 的 location 继承本块）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # sitemap 由后端生成，避免被 SPA 路由吞掉
    location = /sitemap.xml {
        proxy_pass http://backend_servers/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 根路径指向Web前端
    location / {
        proxy_pass http://web_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API请求代理到后端
    location /api/ {
        proxy_pass http://backend_servers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include conf.d/cors.include;
    }

    # 校园成长账本小程序后端（临时部署，约 1 个月后撤销：
    # 删除本段后重新 build 并部署 nginx 镜像即可，后端栈在 /opt/campusflow）
    location /cf-api/ {
        proxy_pass http://172.17.0.1:13000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 服务代理（SSE + 动态源 CORS），配置提取到 ai-proxy.include 两站共用
    include conf.d/ai-proxy.include;

    # 文件访问：加浏览器长缓存，减少重复下载
    location /uploads/ {
        proxy_pass http://backend_servers/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /upload/ {
        proxy_pass http://backend_servers/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# Admin管理后台 - admin.liuxin.chat（443，直连源站不走CDN）
# 后台使用独立域名证书，证书通过宿主机只读挂载，不进入镜像。
server {
    listen 443 ssl;
    http2 on;
    server_name admin.liuxin.chat;

    # SSL 证书（后台独立证书）
    ssl_certificate /etc/nginx/ssl/admin.liuxin.chat_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.liuxin.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全响应头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://admin_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API请求代理到后端
    location /api/ {
        proxy_pass http://backend_servers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include conf.d/cors.include;
    }

    # AI 服务代理（SSE + 动态源 CORS），配置提取到 ai-proxy.include 两站共用
    include conf.d/ai-proxy.include;

    # 文件访问：加浏览器长缓存，减少重复下载
    location /uploads/ {
        proxy_pass http://backend_servers/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /upload/ {
        proxy_pass http://backend_servers/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

