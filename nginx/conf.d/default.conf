# 默认站点配置
# 作者: 刘鑫
# 时间: 2025-01-01

# 上游服务器配置
upstream backend_servers {
    server backend:8080;
}

upstream ai_servers {
    server ai:8081;
}

upstream web_servers {
    server web:80;
}

upstream admin_servers {
    server admin:80;
}

# HTTP重定向到HTTPS（主站点）
server {
    listen 80;
    server_name liuxin.chat;
    return 301 https://$server_name$request_uri;
}

# HTTP重定向到HTTPS（admin 后台子域名）
server {
    listen 80;
    server_name admin.liuxin.chat;
    return 301 https://$server_name$request_uri;
}

# HTTPS主站点 - Web前端
server {
    listen 443 ssl;
    http2 on;
    server_name liuxin.chat;

    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/liuxin.chat_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/liuxin.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全响应头（HTML 等无自身 add_header 的 location 继承本块）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # sitemap 由后端生成，避免被 SPA 路由吞掉
    location = /sitemap.xml {
        proxy_pass http://backend_servers/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 根路径指向Web前端
    location / {
        proxy_pass http://web_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API请求代理到后端
    location /api/ {
        proxy_pass http://backend_servers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include conf.d/cors.include;
    }

    include conf.d/tts-proxy.include;

    # AI 服务代理（SSE + 动态源 CORS），配置提取到 ai-proxy.include 两站共用
    include conf.d/ai-proxy.include;

    # 文件访问：加浏览器长缓存，减少重复下载
    location /uploads/ {
        proxy_pass http://backend_servers/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /upload/ {
        proxy_pass http://backend_servers/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# Admin管理后台 - admin.liuxin.chat（443，直连源站不走CDN）
# 注意：当前证书不覆盖 admin.liuxin.chat，浏览器会报名称不匹配；
#       故本块不发 HSTS，否则证书错误会被浏览器硬拦截无法继续访问。
server {
    listen 443 ssl;
    http2 on;
    server_name admin.liuxin.chat;

    # SSL 证书（复用主站点证书）
    ssl_certificate /etc/nginx/ssl/liuxin.chat_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/liuxin.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全响应头（不开 HSTS：见块顶注释）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://admin_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API请求代理到后端
    location /api/ {
        proxy_pass http://backend_servers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include conf.d/cors.include;
    }

    include conf.d/tts-proxy.include;

    # AI 服务代理（SSE + 动态源 CORS），配置提取到 ai-proxy.include 两站共用
    include conf.d/ai-proxy.include;

    # 文件访问：加浏览器长缓存，减少重复下载
    location /uploads/ {
        proxy_pass http://backend_servers/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /upload/ {
        proxy_pass http://backend_servers/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}

# Admin管理后台 - 端口81（HTTPS，复用主站点证书，避免凭据明文传输）
# 保留作为 admin.liuxin.chat 证书未覆盖期间的直连备用入口
server {
    listen 81 ssl;
    http2 on;
    server_name liuxin.chat;

    # SSL 证书（复用主站点证书）
