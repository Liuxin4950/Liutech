# 本机 HTTP 验收入口，不使用生产域名跳转和证书。
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;
    include /etc/nginx/local-proxy.include;
    location / { proxy_pass http://web:80; }
}
server {
    listen 81;
    server_name localhost;
    client_max_body_size 100m;
    include /etc/nginx/local-proxy.include;
    location / { proxy_pass http://admin:80; }
}
