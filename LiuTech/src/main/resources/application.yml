spring:
  profiles:
    active: dev
  application:
    name: LiuTech
  main:
    allow-circular-references: true
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  # 上传文件通过 WebConfig 中的显式 /uploads/images、/uploads/documents、/uploads/music 映射暴露。
  # 不把上传根目录注册为默认静态目录，避免 /resources/** 绕过资源购买下载接口。
  datasource:
    # 数据源URL由不同环境的配置文件覆盖：
    # - application-dev.yml：本地开发（示例使用 127.0.0.1:3307）
    # - application-prod.yml：Docker/生产（示例使用 docker 网络主机名 mysql:3306）
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 15000
      max-lifetime: 900000
      leak-detection-threshold: 60000
      pool-name: HikariCP-Blog
      connection-test-query: SELECT 1

  # 邮件配置（忘记密码、邮箱验证码登录）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    display-name: ${MAIL_DISPLAY_NAME:LiuTech博客}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: chat.liuxin.liutech.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  # 分页插件配置
  configuration-properties:
    helperDialect: mysql
    reasonable: true
    supportMethodsArguments: true
    params: count=countSql

logging:
  level:
    root: INFO
    "[org.apache.ibatis]": WARN
    "[com.baomidou.mybatisplus]": WARN
    "[chat.liuxin.liutech.mapper]": WARN
    "[chat.liuxin.liutech.aspect]": DEBUG
    "[org.springframework.data.repository.config.RepositoryConfigurationDelegate]": WARN

server:
  port: 8080

# AI 服务地址（主后端用于聚合运行时状态）
# Docker 内默认使用服务名 ai:8081；本地开发由 application-dev.yml 覆盖为 127.0.0.1:8081
ai:
  service:
    url: ${AI_SERVICE_URL:http://ai:8081}

# 文件上传配置
file:
  upload:
    base-path: ${FILE_UPLOAD_BASE_PATH:${user.dir}/uploads}  # 默认使用绝对路径，避免相对路径被Tomcat解析到临时目录
    max-file-size: 104857600  # 100MB = 100 * 1024 * 1024 字节
    max-image-size: 10485760  # 10MB = 10 * 1024 * 1024 字节
    url-prefix: /uploads
  upload-dir: uploads  # 保持向后兼容
  tomcat:
    uri-encoding: UTF-8

# JWT 配置
jwt:
  # 签名密钥 - 生产环境必须使用强密钥（通过环境变量注入）
  # 本地开发也应通过环境变量或启动参数注入，避免默认密钥入库
  # 生成强密钥命令：openssl rand -base64 64
  secret: ${JWT_SECRET}
  expiration: 2592000000  # 30天，单位：毫秒
  header: Authorization
  prefix: Bearer

